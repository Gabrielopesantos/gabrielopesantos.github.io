{% extends "base.html" %}
{% block content %}
<div id="ff-panel" hidden>
  <div id="ff-ui">
    <button id="ff-reroll">reroll ↻</button>
  </div>

  <h4>Motion</h4>
  <div class="row">
    <label>Speed <span id="ff-speed-out"></span></label>
    <input type="range" id="ff-speed" min="0" max="1" step="0.01">
  </div>
  <div class="row">
    <label>Curl <span id="ff-curl-out"></span></label>
    <input type="range" id="ff-curl" min="0" max="1" step="0.01">
  </div>
  <div class="row">
    <label>Detail <span id="ff-scale-out"></span></label>
    <input type="range" id="ff-scale" min="0" max="1" step="0.01">
  </div>

  <h4>Trails</h4>
  <div class="row">
    <label>Fade <span id="ff-fade-out"></span></label>
    <input type="range" id="ff-fade" min="0" max="1" step="0.01">
  </div>
  <div class="row">
    <label>Length <span id="ff-life-out"></span></label>
    <input type="range" id="ff-life" min="0" max="1" step="0.01">
  </div>
  <div class="row">
    <label>Count <span id="ff-count-out"></span></label>
    <input type="range" id="ff-count" min="0" max="1" step="0.01">
  </div>

  <h4>Color</h4>
  <div class="modes">
    <button id="ff-mode-gradient">gradient</button>
    <button id="ff-mode-contrast">contrasting</button>
  </div>
  <div id="ff-info"></div>
</div>

<div class="site-info">
  <main>
    {{ section.content | safe }}
  </main>
  <footer>
    <a href="https://github.com/gabrielopesantos" aria-label="GitHub">
      <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 0.297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385 0.6 0.113 0.82-0.258 0.82-0.577 0-0.285-0.01-1.04-0.015-2.04-3.338 0.724-4.042-1.61-4.042-1.61-0.546-1.387-1.333-1.756-1.333-1.756-1.089-0.745 0.083-0.73 0.083-0.73 1.205 0.084 1.84 1.236 1.84 1.236 1.07 1.835 2.809 1.305 3.495 0.998 0.108-0.776 0.42-1.305 0.763-1.605-2.665-0.3-5.466-1.332-5.466-5.93 0-1.31 0.465-2.38 1.235-3.22-0.135-0.303-0.54-1.523 0.105-3.176 0 0 1.005-0.322 3.3 1.23 0.96-0.267 1.98-0.399 3-0.405 1.02 0.006 2.04 0.138 3 0.405 2.28-1.552 3.285-1.23 3.285-1.23 0.645 1.653 0.24 2.873 0.12 3.176 0.765 0.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92 0.42 0.36 0.81 1.096 0.81 2.22 0 1.606-0.015 2.896-0.015 3.286 0 0.315 0.21 0.69 0.825 0.57 4.77-1.585 8.205-6.082 8.205-11.385 0-6.627-5.373-12-12-12z"/>
      </svg>
    </a>

    <span id="email-reveal" class="email" role="button" tabindex="0" title="Reveal email address">
      <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
      </svg>
    </span>
    <script>
      (function () {
        var encodedEmail = "bWVAZ2FicmllbG9wZXNhbnRvcy5jb20K";

        function reveal() {
          var email = atob(encodedEmail);
          var el = document.getElementById("email-reveal");
          var a = document.createElement("a");
          a.href = email;
          a.textContent = email.replace("mailto:", "");
          el.replaceWith(a);
        }

        var emailEl = document.getElementById("email-reveal");
        emailEl.addEventListener("click", reveal);
        emailEl.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            reveal();
          }
        });
      })();
    </script>
  </footer>
</div>
{% endblock content %}
