name: Deploy to GitHub Pages

# Disabled for now. To enable automatic deploys on push to main, change this to:
#
# on:
#   push:
#     branches: [main]
#
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zola
        env:
          ZOLA_VERSION: 0.21.0
        run: |
          curl -fsSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo install zola /usr/local/bin/zola

      - name: Build site
        run: zola build --base-url https://gabrielopesantos.github.io

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
